  .slide-title {
    font-size: 17px;
    font-weight: 600;
    color: #58a6ff;
    letter-spacing: .02em;
    margin-bottom: 16px;
    align-self: flex-start;

<div class="dots" id="dots"></div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  const prev   = document.getElementById('prev');
  const next   = document.getElementById('next');
  const counter= document.getElementById('counter');
  let cur = 0;

  // build dots
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i===0?' active':'');
    d.addEventListener('click', () => goto(i));
    dotsEl.appendChild(d);
  });

  function goto(n) {
    slides[cur].classList.remove('active');
    dotsEl.children[cur].classList.remove('active');
    cur = n;
    slides[cur].classList.add('active');
    dotsEl.children[cur].classList.add('active');
    counter.textContent = `${cur+1} / ${slides.length}`;
    prev.disabled = cur === 0;
    next.disabled = cur === slides.length - 1;
  }

  prev.addEventListener('click', () => { if(cur>0) goto(cur-1); });
  next.addEventListener('click', () => { if(cur<slides.length-1) goto(cur+1); });

  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); if(cur<slides.length-1) goto(cur+1); }
    if(e.key==='ArrowLeft') { e.preventDefault(); if(cur>0) goto(cur-1); }
  });
</script>
